function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cmp(x,y){return x.localeCompare(y,'it',{sensitivity:'base'})}
function sorted(x){return x.slice().sort(function(p,q){return cmp(p.artist,q.artist)||cmp(p.album,q.album)||((p.track||999)-(q.track||999))||cmp(p.title,q.title)})}
function mime(n){var e=(n.split('.').pop()||'').toLowerCase();return{flac:'audio/flac',mp3:'audio/mpeg',m4a:'audio/mp4',mp4:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',wav:'audio/wav',aif:'audio/aiff',aiff:'audio/aiff',wma:'audio/x-ms-wma'}[e]||'audio/mpeg'}
/* archivio nel dispositivo */
function dbo(){return new Promise(function(ok,no){try{var r=indexedDB.open('ipod2',1);r.onupgradeneeded=function(){r.result.createObjectStore('m',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('f',{keyPath:'id'})};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}}catch(e){no(e)}})}
function dbq(mode,fn){return new Promise(function(ok,no){if(!db)return no('nodb');var tx=db.transaction(['m','f'],mode),q=fn(tx);tx.oncomplete=function(){ok(q&&q.result)};tx.onerror=tx.onabort=function(){no(tx.error)}})}
function hydrate(r){r.url='';r.art=r.artBuf?URL.createObjectURL(new Blob([r.artBuf],{type:r.artType||'image/jpeg'})):'';return r}
async function urlFor(t){
  if(t.url)return t.url;var b=t.file;
  if(!b){var o=await new Promise(function(ok,no){var q=db.transaction('f').objectStore('f').get(t.id);q.onsuccess=function(){ok(q.result)};q.onerror=function(){no(q.error)}});
    if(!o||!o.buf||!o.buf.byteLength)throw 0;b=new Blob([o.buf],{type:t.type||'audio/mpeg'})}
  t.url=URL.createObjectURL(b);return t.url;
}
/* schermata */
function rowH(i,on,art,t,s,c){return'<div class="it'+(on?' on':'')+'" data-i="'+i+'"><div class="th">'+(art?'<img alt="" src="'+art+'">':GL)+'</div><div class="tx"><div class="tt"><ins class="in">'+esc(t)+'</ins></div>'+(s?'<div class="ss">'+esc(s)+'</div>':'')+'</div>'+(c!=null?'<span class="ct">'+esc(c)+'</span>':'')+'</div>'}
function songRows(arr){return arr.map(function(x,i){acts.push(function(){queue=arr;playQ(i)});return rowH(acts.length-1,x===cur,x.art,x.title,x.artist+' \u00B7 '+x.album)}).join('')}
function renderXb(){$('xb').innerHTML=CATS.map(function(c,i){return'<button class="cat'+(i===cat?' sel':'')+'" data-c="'+i+'"><svg viewBox="0 0 24 24">'+c[1]+'</svg>'+c[0]+'</button>'}).join('')}
function renderList(){
  var l=$('lst'),sc=l.scrollTop,h='';acts=[];
  if(busy)h='<div class="msg">'+esc(busy)+'</div>';
  else if(cat===4){
    acts.push(function(){$('file').click()});h+=rowH(0,0,'','Aggiungi brani','Scegli file mp3, flac, m4a\u2026');
    acts.push(wipeAct);h+=rowH(1,0,'',wp?'Tocca ancora per svuotare':'Svuota libreria','Elimina tutti i brani salvati');
    h+='<div class="msg">'+esc(note||lib.length+' brani nella libreria')+'</div>';
  }else if(!lib.length)h='<div class="msg">Nessun brano. Vai in \u201CLibreria\u201D e tocca \u201CAggiungi brani\u201D.</div>';
  else if(cat===0)h=songRows(sorted(lib));
  else if(drill){acts.push(function(){drill=null;renderList()});h=rowH(0,0,'','\u2039 '+drill.t,'Indietro')+songRows(drill.arr)}
  else{
    var key=['','album','artist','genre'][cat],m=Object.create(null);lib.forEach(function(x){(m[x[key]]=m[x[key]]||[]).push(x)});
    h=Object.keys(m).sort(cmp).map(function(n){var arr=sorted(m[n]),f=arr.filter(function(x){return x.art})[0];
      acts.push(function(){drill={t:n,arr:arr};renderList();$('lst').scrollTop=0});
      return rowH(acts.length-1,0,cat===3||!f?'':f.art,n,cat===1?arr[0].artist:'',arr.length)}).join('');
  }
  l.innerHTML=h;l.scrollTop=sc;marq();
}
function renderNp(){
  $('npArt').innerHTML=cur&&cur.art?'<img alt="" src="'+cur.art+'">':'';
  $('npT').innerHTML='<ins class="in">'+esc(cur?cur.title:'Nessun brano')+'</ins>';
  $('npS').innerHTML='<ins class="in">'+esc(err||(cur?cur.artist+' \u00B7 '+cur.album:'Scegli un brano'))+'</ins>';
  $('bPlay').innerHTML=(cur&&!a.paused)?IZ:IP;tick();marq();
}
function tick(){var d=a.duration,c=a.currentTime||0;$('npPg').style.width=(d?c/d*100:0)+'%';$('npTc').textContent=fmt(c);$('npTd').textContent='-'+fmt(d?d-c:0)}
function marq(){
  var els=document.querySelectorAll('.it.on .tt,#npT,#npS');
  Array.prototype.forEach.call(els,function(e){e.className=e.className.replace(/ ?mq/,'')});
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  Array.prototype.forEach.call(els,function(e){var n=e.firstChild;if(!n||!n.offsetWidth)return;var ov=n.offsetWidth-e.clientWidth;if(ov>1){e.className+=' mq';e.style.setProperty('--d',-ov+'px');e.style.setProperty('--t',(ov/28+4).toFixed(1)+'s')}});
}
/* riproduzione */
async function playQ(i){
  var t=queue[i],k=++ptok;
  if(cur&&cur!==t&&!cur.file&&cur.url){URL.revokeObjectURL(cur.url);cur.url=''}
  qi=i;cur=t;err='';renderNp();renderList();
  try{var u=await urlFor(t);if(k!==ptok)return;a.src=u;a.play().catch(function(){})}
  catch(e){if(k===ptok){err='Brano non leggibile: riaggiungilo.';renderNp()}}
}
function toggle(){if(!cur){if(lib.length){queue=sorted(lib);playQ(0)}return}if(a.paused)a.play();else a.pause()}
function next(d){var n=qi+d;if(!queue.length||n<0||n>=queue.length)return;playQ(n)}
a.addEventListener('timeupdate',tick);a.addEventListener('play',renderNp);a.addEventListener('pause',renderNp);
a.addEventListener('ended',function(){if(qi+1<queue.length)playQ(qi+1);else renderNp()});
window.addEventListener('pointerdown',function(){if(unl)return;unl=true;if(!cur){a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';a.play().then(function(){if(a.src.indexOf('data:')===0)a.pause()}).catch(function(){})}});
function hold(btn,dir){
  var tm=0,iv=0,held=false,n=0;
  function stop(){clearTimeout(tm);clearInterval(iv)}
  btn.addEventListener('pointerdown',function(){held=false;n=0;stop();tm=setTimeout(function(){held=true;iv=setInterval(function(){
    if(!cur||!a.duration)return;n++;var t=a.currentTime+dir*Math.min(3+n*.3,12);
    if(t>=a.duration-.3){a.currentTime=a.duration-.3;stop();return}
    a.currentTime=Math.max(0,t);tick()},120)},400)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(e){btn.addEventListener(e,stop)});
  btn.addEventListener('contextmenu',function(e){e.preventDefault()});
  btn.onclick=function(){if(held){held=false;return}next(dir)};
}
hold($('bNext'),1);hold($('bPrev'),-1);$('bPlay').onclick=toggle;
/* importazione */
function tags(f){return new Promise(function(ok){var d=setTimeout(function(){ok({})},5000);
  function end(v){clearTimeout(d);ok(v)}
  try{if(!window.jsmediatags)return end({});window.jsmediatags.read(f,{onSuccess:function(t){end(t.tags||{})},onError:function(){end({})}})}catch(e){end({})}})}
async function addFiles(files){
  var list=Array.prototype.filter.call(files,function(f){return OK.test(f.name)||(f.type&&f.type.indexOf('audio')===0)});
  if(!list.length){note='I file scelti non sembrano audio. Prova con mp3, flac, m4a, wav o ogg.';renderList();return}
  note='';
  for(var i=0;i<list.length;i++){
    var f=list[i],key=f.name+'|'+f.size;busy='Importo '+(i+1)+' di '+list.length+'\u2026';renderList();
    if(lib.some(function(t){return t.key===key}))continue;
    var g=await tags(f),ab=null,at='';
    if(g.picture){try{ab=new Uint8Array(g.picture.data).buffer;at=g.picture.format||'image/jpeg'}catch(e){}}
    var gen=String(g.genre||'').replace(/^\(\d+\)/,'').trim();if(/^\d+$/.test(gen))gen='';
    var rec={key:key,title:g.title||f.name.replace(/\.[^.]+$/,''),artist:g.artist||'Artista sconosciuto',album:g.album||'Album sconosciuto',genre:gen||'Altro',track:parseInt(String(g.track||'').split('/')[0],10)||0,type:f.type||mime(f.name),artBuf:ab,artType:at};
    var t=Object.assign({},rec,{file:f});
    try{var buf=await f.arrayBuffer();t.id=await dbq('readwrite',function(tx){var q=tx.objectStore('m').put(rec);q.onsuccess=function(){tx.objectStore('f').put({id:q.result,buf:buf})};return q})}catch(e){note='Non riesco a salvare i brani su questo dispositivo: restano solo finch\u00E9 la pagina \u00E8 aperta.'}
    lib.push(hydrate(t));
  }
  busy='';cat=0;drill=null;renderXb();renderList();
}
function wipeAct(){
  if(!wp){wp=setTimeout(function(){wp=0;renderList()},3000);renderList();return}
  clearTimeout(wp);wp=0;a.pause();a.removeAttribute('src');cur=null;queue=[];
  lib.forEach(function(t){URL.revokeObjectURL(t.url);if(t.art)URL.revokeObjectURL(t.art)});lib=[];note='';
  dbq('readwrite',function(tx){tx.objectStore('f').clear();return tx.objectStore('m').clear()}).catch(function(){});
  renderNp();renderList();
}
$('file').onchange=function(e){addFiles(e.target.files).then(function(){$('file').value=''})};
$('xb').onclick=function(e){var b=e.target.closest('.cat');if(!b)return;cat=+b.dataset.c;drill=null;renderXb();renderList();$('lst').scrollTop=0};
$('lst').onclick=function(e){var it=e.target.closest('.it');if(it&&acts[+it.dataset.i])acts[+it.dataset.i]()};
/* orologio e sfondo */
function clock(){var d=new Date();$('clk').textContent=p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
var cv=$('bg'),cx=cv.getContext('2d'),W=0,H=0,RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function fit(){var r=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);if(RM)wave(0)}
function wave(t){
  var g=cx.createLinearGradient(0,0,W*.3,H);g.addColorStop(0,'#030108');g.addColorStop(.55,'#0c0520');g.addColorStop(1,'#1a0d3a');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(var k=0;k<5;k++){cx.beginPath();cx.moveTo(0,H);
    for(var x=0;x<=W;x+=10){cx.lineTo(x,H*(.42+k*.09)+Math.sin(x*.008+t*(.0004+k*.00008)+k*1.7)*H*.05+Math.sin(x*.015-t*.0006+k)*H*.02)}
    cx.lineTo(W,H);cx.closePath();cx.fillStyle='rgba(190,160,255,'+(.025+k*.008)+')';cx.fill();cx.strokeStyle='rgba(190,160,255,.1)';cx.lineWidth=1;cx.stroke()}
}
function loop(t){wave(t);requestAnimationFrame(loop)}
window.addEventListener('resize',fit);fit();if(!RM)requestAnimationFrame(loop);
clock();setInterval(clock,1000);
renderXb();renderList();renderNp();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
dbo().then(function(d){db=d;return dbq('readonly',function(tx){return tx.objectStore('m').getAll()})}).then(function(rs){lib=(rs||[]).map(hydrate)}).catch(function(){note='Il salvataggio non \u00E8 disponibile su questo dispositivo.'}).then(function(){renderList()});
</script>
